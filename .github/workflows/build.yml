name: APK Build

on:
  workflow_dispatch:
  push:
    branches: [ develop ]

permissions:
  contents: write
  
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=8g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace -Dsonar.gradle.skipCompile=true --no-configuration-cache

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    concurrency:
      group: release-build-${{ github.sha }}
      cancel-in-progress: false
    
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          
      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
          
      - name: Compile release sources
        env:
          ELEMENT_ANDROID_MAPTILER_API_KEY: ${{ secrets.MAPTILER_KEY }}
          ELEMENT_ANDROID_MAPTILER_LIGHT_MAP_ID: ${{ secrets.MAPTILER_LIGHT_MAP_ID }}
          ELEMENT_ANDROID_MAPTILER_DARK_MAP_ID: ${{ secrets.MAPTILER_DARK_MAP_ID }}
          ELEMENT_ANDROID_SENTRY_DSN: ${{ secrets.ELEMENT_ANDROID_SENTRY_DSN }}
          ELEMENT_SDK_SENTRY_DSN: ${{ secrets.ELEMENT_SDK_SENTRY_DSN }}
          ELEMENT_CALL_SENTRY_DSN: ${{ secrets.ELEMENT_CALL_SENTRY_DSN }}
          ELEMENT_CALL_POSTHOG_API_HOST: ${{ secrets.ELEMENT_CALL_POSTHOG_API_HOST }}
          ELEMENT_CALL_POSTHOG_API_KEY: ${{ secrets.ELEMENT_CALL_POSTHOG_API_KEY }}
          ELEMENT_CALL_RAGESHAKE_URL: ${{ secrets.ELEMENT_CALL_RAGESHAKE_URL }}
        run: ./gradlew :app:assembleGplayRelease -PallWarningsAsErrors=true $CI_GRADLE_ARG_PROPERTIES
        
      - name: Find and rename APK file
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK file found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          mv "$APK_PATH" app-release.apk
          echo "APK_FOUND=true" >> $GITHUB_ENV
          
      - name: Create RAR split archive (90MB parts)
        if: env.APK_FOUND == 'true'
        run: |
          # Install rar if not available
          sudo apt-get update
          sudo apt-get install -y rar
          
          # Create split RAR archive with 90MB parts
          rar a -v90m -m5 -ep1 -r app-release.rar app-release.apk || true
          
          # Check if files were created successfully
          if ls app-release.part*.rar 1> /dev/null 2>&1 || ls app-release.r* 1> /dev/null 2>&1; then
            echo "RAR split archives created successfully"
            ls -lh app-release.part*.rar 2>/dev/null || ls -lh app-release.r* 2>/dev/null
          else
            echo "Failed to create RAR archives"
            exit 1
          fi
          
      - name: List created files
        if: env.APK_FOUND == 'true'
        run: |
          echo "Files to be committed:"
          ls -la | grep -E "app-release|.rar" || true
          
      - name: Commit RAR parts to repository
        if: env.APK_FOUND == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git pull origin ${{ github.ref_name }} --rebase || true
          
          if [ -n "$(git status --porcelain)" ]; then
            git add *.rar
            git commit -m "Add release APK split RAR archive (90MB parts) - $(date '+%Y-%m-%d %H:%M:%S')"
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
            echo "Successfully committed RAR parts to repository"
          else
            echo "No changes to commit"
          fi
          
      - name: Clean up local files
        if: always()
        run: |
          rm -f app-release.apk app-release.part*.rar app-release.rar app-release.r* 2>/dev/null || true
          echo "Cleanup completed"
